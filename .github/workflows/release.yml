name: Release binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Compile standalone Linux binaries
        run: |
          mkdir -p dist
          git archive --format=tar HEAD -- package.json bun.lock install.sh packages | gzip -n > dist/vian-source.tar.gz
          for target in linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl; do
            bun build packages/cli/src/main.ts --compile --minify --bytecode \
              --target="bun-$target" --outfile "dist/vian-$target"
          done
          dist/vian-linux-x64 --help >/dev/null
          bun build packages/cli/src/main.ts --target=bun --minify --outfile dist/vian-bun-bundle.js
          { printf '#!/usr/bin/env bun\n'; cat dist/vian-bun-bundle.js; } > dist/vian-bun.js
          rm dist/vian-bun-bundle.js
          chmod 755 dist/vian-bun.js
          (cd /tmp && "$GITHUB_WORKSPACE/dist/vian-bun.js" --help >/dev/null)
          (cd dist && sha256sum vian-linux-* vian-bun.js vian-source.tar.gz > SHA256SUMS)
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/vian-linux-* dist/vian-bun.js dist/vian-source.tar.gz dist/SHA256SUMS LICENSE \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Bun source install and optional standalone Linux binaries. See the release report for unverified live gates." \
            "${flags[@]}"
